<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#101113" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<script>
			try {
				const stored = localStorage.getItem('collision-theme');
				const preferred =
					stored === 'light' || stored === 'dark'
						? stored
						: matchMedia('(prefers-color-scheme: light)').matches
							? 'light'
							: 'dark';
				document.documentElement.dataset.theme = preferred;
			} catch (error) {
				console.error('Unable to read the saved theme preference.', error);
				document.documentElement.dataset.theme = 'dark';
			}
			// Start the intro before first paint; release it if the app never mounts to take it over.
			document.documentElement.dataset.intro = 'loading';
			setTimeout(function () {
				var root = document.documentElement;
				if (root.dataset.introOwner !== 'app') delete root.dataset.intro;
			}, 12000);
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
