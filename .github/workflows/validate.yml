name: Frontend validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Unit and browser tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          VITE_API_URL: https://ml-server2.onrender.com
