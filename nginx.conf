server {
	listen 8080;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	location ~ ^/_app/.*\.mjs$ {
		types { application/javascript mjs; }
		try_files $uri =404;
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	location /_app/ {
		try_files $uri =404;
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	location / {
		try_files $uri $uri/ =404;
	}
}
